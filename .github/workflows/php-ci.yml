
name: PHP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-check:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      # Buoc 1: Lay ma nguon tu GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Buoc 2: Cai dat PHP 8.2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Buoc 3: Kiem tra cu phap cac file PHP
      - name: Check PHP files
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type f -name '*.php' \
              -not -path './.git/*' \
              -not -path './vendor/*' \
              -not -path './node_modules/*' \
              -not -path './lib/PHPMailer/*' \
              -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error::No PHP files found."
            exit 1
          fi

          failed=0
          passed=0

          for file in "${files[@]}"; do
            echo "Checking: $file"

            if php -l "$file"; then
              ((passed+=1))
            else
              echo "::error file=${file#./}::PHP syntax error"
              ((failed+=1))
            fi
          done

          echo "=========================="
          echo "PHP SYNTAX CHECK SUMMARY"
          echo "Total: ${#files[@]}"
          echo "Passed: $passed"
          echo "Failed: $failed"
          echo "=========================="

          if (( failed > 0 )); then
            echo "::error::$failed PHP files failed syntax check."
            exit 1
          fi

          echo "PHP syntax check completed successfully."

      # Buoc 4: Hien thi ket qua
      - name: CI Summary
        if: always()
        shell: bash
        run: |
          echo "## PHP CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- PHP version: 8.2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: PHP syntax validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the job logs for the number of passed and failed PHP files." >> "$GITHUB_STEP_SUMMARY"
